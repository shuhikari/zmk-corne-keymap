# Bateria (necessario pro widget de LED ter o que ler)
CONFIG_ZMK_BATTERY_REPORTING=y

# LED RGB embutido do XIAO nRF52840 (P0.26 vermelho, P0.30 verde, P0.06 azul)
#   > 30%  verde | 10-30% amarelo | < 10% vermelho | < 5% vermelho piscando
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=10
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=5

# 0=preto 1=vermelho 2=verde 3=amarelo 4=azul 5=magenta 6=ciano 7=branco
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_HIGH=2
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_MEDIUM=3
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_LOW=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CRITICAL=1

CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_ADVERTISING=3
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=1

CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=2000
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=1000

# Energia
CONFIG_ZMK_SLEEP=y
CONFIG_NFCT_PINS_AS_GPIOS=y
